name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out add-on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact BlueMap backport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jan-guenter/BlueMap
          ref: fe79cf5b9f4d8ca28f4e41c2aeb9ef792e336a8d
          path: .ci/bluemap
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize exact BlueMap build identity
        run: |
          git -C .ci/bluemap/api fetch --force --tags origin
          git -C .ci/bluemap switch --create \
            agent/backport-5.22-mc1.21.1
          test "$(git -C .ci/bluemap describe --tags --abbrev=0)" = "v5.22"
          test "$(git -C .ci/bluemap/api describe --tags --abbrev=0)" = "v2.8.0"

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: true

      - name: Verify generated gallery
        run: |
          python3 gallery/generate.py --check
          python3 -m json.tool provenance/upstreams.json >/dev/null
          cd gallery
          sha256sum --check SHA256SUMS

      - name: Acquire exact FramedBlocks test input
        run: |
          mkdir -p "${RUNNER_TEMP}/framedblocks"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${RUNNER_TEMP}/framedblocks/FramedBlocks-10.6.1.jar" \
            "https://cdn.modrinth.com/data/wbgfS34j/versions/FBXGqSP5/FramedBlocks-10.6.1.jar"

      - name: Build and test
        run: |
          ./gradlew --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            -PframedblocksJar="${RUNNER_TEMP}/framedblocks/FramedBlocks-10.6.1.jar" \
            clean check build geometryProjectionClasses \
            generatePomFileForAddonPublication \
            generateMetadataFileForAddonPublication \
            verifyPublicationPom verifyPinnedArtifact
          test -s build/publications/addon/pom-default.xml
          test -s build/publications/addon/module.json

      - name: Verify packaged provenance
        run: |
          version="$(sed -n 's/^addon_version=//p' gradle.properties)"
          unzip -p "build/libs/bluemap-framedblocks-addon-${version}.jar" \
            META-INF/bluemap-framedblocks/upstreams.json | \
            cmp - provenance/upstreams.json

      - name: Upload build outputs and reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bluemap-framedblocks-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/publications/addon/pom-default.xml
            build/publications/addon/module.json
            build/reports/**
          if-no-files-found: error
          retention-days: 14

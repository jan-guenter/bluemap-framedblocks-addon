def productionJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def publishedSourcesJar = tasks.named('sourcesJar', Jar).flatMap { it.archiveFile }

tasks.register('verifyProductionJar') {
    dependsOn tasks.named('jar')
    inputs.file(productionJar)

    doLast {
        def jarFile = inputs.files.singleFile
        def zipFile = new java.util.zip.ZipFile(jarFile)
        try {
            def entries = zipFile.entries()
                    .findAll { !it.directory }
                    .collect { it.name }

            def readJson = { String entryName ->
                def content = zipFile.getInputStream(zipFile.getEntry(entryName)).withCloseable {
                    it.getText('UTF-8')
                }
                new groovy.json.JsonSlurper().parseText(content)
            }

            def requiredEntries = [
                    'bluemap.addon.json',
                    'assets/bluemap_framedblocks/blockstates/framed_shape.json',
                    'bluemap-framedblocks/profiles/10.6.1/block-entity-ids.txt',
                    'bluemap-framedblocks/profiles/10.6.1/blockstate-ids.txt',
                    'bluemap-framedblocks/profiles/10.6.1/geometry-templates.json.gz',
                    'META-INF/LICENSE-bluemap-framedblocks-addon',
                    'META-INF/LICENSE-bluemap-addon-adapter-api',
                    'META-INF/LICENSES/GPL-3.0-only.txt',
                    'META-INF/LICENSES/LGPL-3.0-only.txt',
                    'META-INF/NOTICE-bluemap-framedblocks-addon.md',
                    'META-INF/THIRD_PARTY-bluemap-framedblocks-addon.md',
                    'META-INF/bluemap-framedblocks/upstreams.json'
            ] + sharedAdapterApiClasses
            def missing = requiredEntries.findAll { !entries.contains(it) }
            def duplicateShared = sharedAdapterApiClasses.findAll { shared ->
                entries.count { it == shared } != 1
            }
            if (!missing.isEmpty() || !duplicateShared.isEmpty()) {
                throw new GradleException(
                        "Production JAR shared boundary mismatch: missing=${missing}, "
                                + "nonUnique=${duplicateShared}"
                )
            }

            def manifest = new java.util.jar.Manifest(
                    zipFile.getInputStream(zipFile.getEntry('META-INF/MANIFEST.MF'))
            )
            def manifestAttributes = manifest.mainAttributes
            if (manifestAttributes.getValue('Automatic-Module-Name') !=
                    'io.github.janguenter.bluemap.framedblocks' ||
                    manifestAttributes.getValue('Implementation-Title') != addon_name ||
                    manifestAttributes.getValue('Implementation-Version') !=
                            project.version.toString()) {
                throw new GradleException('Production JAR manifest identity mismatch')
            }

            def sha256 = { byte[] bytes ->
                java.util.HexFormat.of().formatHex(
                        java.security.MessageDigest.getInstance('SHA-256').digest(bytes)
                )
            }
            def geometryEntry = zipFile.getEntry(
                    'bluemap-framedblocks/profiles/10.6.1/geometry-templates.json.gz'
            )
            byte[] geometryGzip = zipFile.getInputStream(geometryEntry).withCloseable {
                it.readAllBytes()
            }
            if (geometryGzip.length != expectedGeometryGzipBytes ||
                    sha256(geometryGzip) != expectedGeometryGzipSha256) {
                throw new GradleException('Projected geometry gzip payload pin mismatch')
            }
            byte[] geometryJson = new java.util.zip.GZIPInputStream(
                    new java.io.ByteArrayInputStream(geometryGzip)
            ).withCloseable { it.readAllBytes() }
            if (geometryJson.length != expectedGeometryJsonBytes ||
                    sha256(geometryJson) != expectedGeometryJsonSha256) {
                throw new GradleException('Projected geometry JSON payload pin mismatch')
            }

            def addonInfo = readJson('bluemap.addon.json')
            if (addonInfo.id != addon_id ||
                    addonInfo.entrypoint !=
                            'io.github.janguenter.bluemap.framedblocks.BlueMapFramedBlocksAddon' ||
                    addonInfo.dependencies != [] || addonInfo['soft-dependencies'] != []) {
                throw new GradleException('bluemap.addon.json does not match the add-on contract')
            }

            def syntheticBlockstate = readJson(
                    'assets/bluemap_framedblocks/blockstates/framed_shape.json'
            )
            def syntheticVariant = syntheticBlockstate.variants?.get('')
            if (syntheticVariant?.renderer != 'bluemap_framedblocks:framed_shape' ||
                    syntheticVariant?.model != 'bluemap:block/missing') {
                throw new GradleException('Synthetic exact-profile blockstate contract mismatch')
            }

            def forbidden = entries.findAll {
                it.endsWith('.jar') ||
                        it == 'META-INF/neoforge.mods.toml' ||
                        it == 'fabric.mod.json' ||
                        it.endsWith('.mixins.json') ||
                        (it.endsWith('.class') &&
                                !it.startsWith(
                                        'io/github/janguenter/bluemap/framedblocks/'
                                ) && !sharedAdapterApiClasses.contains(it)) ||
                        it.startsWith('de/bluecolored/') ||
                        it.startsWith('xfacthd/') ||
                        it.startsWith('net/minecraft/') ||
                        it.startsWith('net/neoforged/') ||
                        (it.startsWith(legacyLocalAdapterPackage) && !it.endsWith('/')) ||
                        (it.startsWith(sharedAdapterApiPackage) && !it.endsWith('/') &&
                                !sharedAdapterApiClasses.contains(it))
            }
            if (!forbidden.isEmpty()) {
                throw new GradleException("Production JAR contains forbidden entries: ${forbidden}")
            }

            def unexpected = entries.findAll {
                !(it == 'META-INF/MANIFEST.MF') &&
                        !(it in requiredEntries) &&
                        !(it.startsWith('io/github/janguenter/bluemap/framedblocks/') &&
                                it.endsWith('.class')) &&
                        !sharedAdapterApiClasses.contains(it)
            }
            if (!unexpected.isEmpty()) {
                throw new GradleException("Production JAR contains unexpected entries: ${unexpected}")
            }

            def projectClasses = entries.findAll {
                it.startsWith('io/github/janguenter/bluemap/framedblocks/') &&
                        it.endsWith('.class')
            }
            if (projectClasses.isEmpty()) {
                throw new GradleException('Production JAR contains no project classes')
            }

            (projectClasses + sharedAdapterApiClasses).each { className ->
                def classEntry = zipFile.getEntry(className)
                def header = zipFile.getInputStream(classEntry).withCloseable {
                    it.readNBytes(8)
                }
                if (header.length != 8) {
                    throw new GradleException("Truncated class file in production JAR: ${className}")
                }
                def majorVersion = (Byte.toUnsignedInt(header[6]) << 8) |
                        Byte.toUnsignedInt(header[7])
                if (majorVersion != 65) {
                    throw new GradleException(
                            "${className} has class-file major ${majorVersion}; expected 65"
                    )
                }
            }
        } finally {
            zipFile.close()
        }
    }
}

tasks.register('verifySourcesJar') {
    dependsOn tasks.named('sourcesJar')
    inputs.file(publishedSourcesJar)

    doLast {
        def zipFile = new java.util.zip.ZipFile(inputs.files.singleFile)
        try {
            def entries = zipFile.entries()
                    .findAll { !it.directory }
                    .collect { it.name }
            def required = [
                    'META-INF/LICENSE-bluemap-addon-adapter-api'
            ] + sharedAdapterApiSources
            def missing = required.findAll { !entries.contains(it) }
            def duplicateShared = sharedAdapterApiSources.findAll { shared ->
                entries.count { it == shared } != 1
            }
            def projectJava = entries.findAll { it.endsWith('.java') }
            def foreignJava = projectJava.findAll {
                !it.startsWith('io/github/janguenter/bluemap/framedblocks/') &&
                        !sharedAdapterApiSources.contains(it)
            }
            def forbidden = entries.findAll {
                it.endsWith('.class') ||
                        it.endsWith('.jar') ||
                        it.startsWith('de/bluecolored/') ||
                        it.startsWith('xfacthd/') ||
                        it.startsWith('net/minecraft/') ||
                        it.startsWith('net/neoforged/') ||
                        (it.startsWith(legacyLocalAdapterPackage) && !it.endsWith('/')) ||
                        (it.startsWith(sharedAdapterApiPackage) && !it.endsWith('/') &&
                                !sharedAdapterApiSources.contains(it))
            }
            if (!missing.isEmpty() || !duplicateShared.isEmpty() ||
                    projectJava.isEmpty() || !foreignJava.isEmpty() ||
                    !forbidden.isEmpty()) {
                throw new GradleException(
                        "Sources JAR boundary mismatch: missing=${missing}, " +
                                "nonUnique=${duplicateShared}, " +
                                "foreignJava=${foreignJava}, forbidden=${forbidden}"
                )
            }
        } finally {
            zipFile.close()
        }
    }
}

tasks.register('verifyPinnedArtifact', Exec) {
    def pinnedJar = providers.gradleProperty('framedblocksJar')
    doFirst {
        if (!pinnedJar.isPresent()) {
            throw new GradleException(
                    'Set -PframedblocksJar=<path-to-FramedBlocks-10.6.1.jar>'
            )
        }
    }
    commandLine 'python3', 'tools/verify_pinned_artifact.py',
            '--jar', pinnedJar.getOrElse('missing')
}

def releaseTag = providers.gradleProperty('releaseTag')
def generatedPom = layout.buildDirectory.file(
        'publications/addon/pom-default.xml'
)
def generatedModule = layout.buildDirectory.file(
        'publications/addon/module.json'
)

tasks.register('verifyReleaseMetadata') {
    dependsOn tasks.named('jar')
    dependsOn tasks.named('sourcesJar')
    dependsOn tasks.named('generatePomFileForAddonPublication')
    dependsOn tasks.named('generateMetadataFileForAddonPublication')
    inputs.file('CHANGELOG.md')
    inputs.file('provenance/release.json')
    inputs.file(productionJar)
    inputs.file(publishedSourcesJar)
    inputs.file(generatedPom)
    inputs.file(generatedModule)
    inputs.property('releaseTag', releaseTag.orElse(''))

    doLast {
        def releaseVersion = project.version.toString()
        def semverPattern = ~/(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?/
        if (!(releaseVersion ==~ semverPattern)) {
            throw new GradleException(
                    "Release version ${releaseVersion} is not a supported SemVer version"
            )
        }
        if (releaseVersion.endsWith('-SNAPSHOT')) {
            throw new GradleException('A GitHub release cannot use a SNAPSHOT version')
        }
        if (!releaseTag.isPresent()) {
            throw new GradleException('Set -PreleaseTag=<tag> for release validation')
        }
        if (releaseTag.get() != "v${releaseVersion}") {
            throw new GradleException(
                    "Release tag ${releaseTag.get()} does not match v${releaseVersion}"
            )
        }
        def changelogPattern = java.util.regex.Pattern.compile(
                '(?m)^## \\[' + java.util.regex.Pattern.quote(releaseVersion) +
                        '\\] - \\d{4}-\\d{2}-\\d{2}$'
        )
        if (!changelogPattern.matcher(
                file('CHANGELOG.md').getText('UTF-8')
        ).find()) {
            throw new GradleException(
                    "CHANGELOG.md has no dated release heading for ${releaseVersion}"
            )
        }
        def release = new groovy.json.JsonSlurper()
                .parse(file('provenance/release.json'))
        if (release.schema_version != 1 ||
                release.status != 'owner-accepted-release-candidate' ||
                release.version != releaseVersion ||
                release.tag != "v${releaseVersion}" ||
                release.repository !=
                        'https://github.com/jan-guenter/bluemap-framedblocks-addon' ||
                release.containsKey('candidate_artifacts') ||
                !(release.final_release_artifacts instanceof Map) ||
                release.owner_accepted_combined_staging?.visual_acceptance != true) {
            throw new GradleException('Owner-accepted release provenance is not sealed')
        }
        def actualArtifacts = [
                production_jar: [
                        file: productionJar.get().asFile,
                        file_name: "${artifact_id}-${project.version}.jar"
                ],
                sources_jar: [
                        file: publishedSourcesJar.get().asFile,
                        file_name: "${artifact_id}-${project.version}-sources.jar"
                ],
                pom: [
                        file: generatedPom.get().asFile,
                        file_name: "${artifact_id}-${project.version}.pom"
                ],
                gradle_module: [
                        file: generatedModule.get().asFile,
                        file_name: "${artifact_id}-${project.version}.module.json"
                ]
        ]
        actualArtifacts.each { name, actual ->
            def recorded = release.final_release_artifacts[name]
            def digest = java.security.MessageDigest.getInstance('SHA-256')
                    .digest(actual.file.bytes)
                    .encodeHex()
                    .toString()
            if (!(recorded instanceof Map) ||
                    recorded.file_name != actual.file_name ||
                    recorded.size != actual.file.length() ||
                    recorded.sha256 != digest) {
                throw new GradleException(
                        "Release provenance mismatch for ${name}: " +
                                "actual=${actual.file.name}/${actual.file.length()}/${digest}"
                )
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyProductionJar')
    dependsOn tasks.named('verifySourcesJar')
}

tasks.register('verifyPublicationPom') {
    dependsOn tasks.named('generatePomFileForAddonPublication')
    inputs.file(generatedPom)

    doLast {
        def pom = new groovy.xml.XmlSlurper(false, false)
                .parse(generatedPom.get().asFile)
        if (pom.groupId.text() != addon_group ||
                pom.artifactId.text() != artifact_id ||
                pom.version.text() != project.version.toString()) {
            throw new GradleException('Publication POM coordinates mismatch')
        }
        if (pom.name.text() != addon_name ||
                pom.description.text() !=
                        'BlueMap 5.23 feature-backport renderer add-on for FramedBlocks 10.6.1' ||
                pom.url.text() !=
                        'https://github.com/jan-guenter/bluemap-framedblocks-addon' ||
                pom.licenses.license.name.text() !=
                        'GNU Lesser General Public License v3.0 only' ||
                pom.licenses.license.url.text() !=
                        'https://spdx.org/licenses/LGPL-3.0-only.html') {
            throw new GradleException('Publication POM project/license metadata mismatch')
        }
        if (pom.scm.url.text() !=
                        'https://github.com/jan-guenter/bluemap-framedblocks-addon' ||
                pom.scm.connection.text() !=
                        'scm:git:https://github.com/jan-guenter/bluemap-framedblocks-addon.git' ||
                pom.scm.developerConnection.text() !=
                        'scm:git:ssh://git@github.com/jan-guenter/bluemap-framedblocks-addon.git' ||
                pom.scm.tag.text() != "v${project.version}") {
            throw new GradleException('Publication POM SCM metadata mismatch')
        }
        if (pom.developers.developer.id.text() != 'jan-guenter' ||
                pom.developers.developer.name.text() != 'Jan Guenter' ||
                pom.developers.developer.url.text() !=
                        'https://github.com/jan-guenter') {
            throw new GradleException('Publication POM developer metadata mismatch')
        }
        if (pom.dependencies.dependency.size() != 0) {
            throw new GradleException('Publication POM must not expose runtime dependencies')
        }
    }
}

publishing {
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri(
                    'https://maven.pkg.github.com/' +
                            'jan-guenter/bluemap-framedblocks-addon'
            )
            credentials {
                username = providers.gradleProperty('gpr.user')
                        .orElse(providers.environmentVariable('GITHUB_ACTOR'))
                        .getOrElse('')
                password = providers.gradleProperty('gpr.key')
                        .orElse(providers.environmentVariable('GITHUB_TOKEN'))
                        .getOrElse('')
            }
        }
    }

    publications {
        addon(MavenPublication) {
            from components.java
            artifactId = artifact_id

            pom {
                name = addon_name
                description =
                        'BlueMap 5.23 feature-backport renderer add-on for FramedBlocks 10.6.1'
                url = 'https://github.com/jan-guenter/bluemap-framedblocks-addon'
                licenses {
                    license {
                        name = 'GNU Lesser General Public License v3.0 only'
                        url = 'https://spdx.org/licenses/LGPL-3.0-only.html'
                    }
                }
                developers {
                    developer {
                        id = 'jan-guenter'
                        name = 'Jan Guenter'
                        url = 'https://github.com/jan-guenter'
                    }
                }
                scm {
                    connection =
                            'scm:git:https://github.com/jan-guenter/bluemap-framedblocks-addon.git'
                    developerConnection =
                            'scm:git:ssh://git@github.com/jan-guenter/bluemap-framedblocks-addon.git'
                    url = 'https://github.com/jan-guenter/bluemap-framedblocks-addon'
                    tag = "v${project.version}"
                }
            }
        }
    }
}

// SPDX-License-Identifier: LGPL-3.0-only

plugins {
    id 'java-library'
    id 'checkstyle'
    id 'maven-publish'
    id 'io.github.janguenter.bluemap-addon.java-conventions'
}

group = addon_group
version = addon_version

base {
    archivesName = artifact_id
}

sourceSets {
    main {
        java.srcDir 'modules/bluemap-addon-adapter-api/src/main/java'
    }
    geometryProjection {
        java.srcDirs = ['src/geometryProjection/java']
        resources.srcDirs = []
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://repo.bluecolored.de/releases')
        content { includeGroupByRegex('de\\.bluecolored.*') }
    }
}

dependencies {
    compileOnly "de.bluecolored:bluemap-core:${bluemap_version}"
    compileOnly 'org.jetbrains:annotations:23.0.0'

    testImplementation "de.bluecolored:bluemap-core:${bluemap_version}"
    testImplementation 'org.jetbrains:annotations:23.0.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    geometryProjectionImplementation sourceSets.main.output
    geometryProjectionImplementation "de.bluecolored:bluemap-core:${bluemap_version}"
    geometryProjectionImplementation 'com.google.code.gson:gson:2.8.9'
}

def rawGeometryExport = providers.gradleProperty('rawGeometryExport')
def projectedGeometryOutput = providers.gradleProperty('projectedGeometryOutput')
        .map { file(it) }
        .orElse(providers.provider {
            file('src/main/resources/bluemap-framedblocks/profiles/10.6.1/' +
                    'geometry-templates.json.gz')
        })

tasks.register('projectGeometryProfile', JavaExec) {
    group = 'build setup'
    description = 'Projects the exact private schema-v2 client capture into schema v3.'
    dependsOn tasks.named('geometryProjectionClasses')
    classpath = sourceSets.geometryProjection.runtimeClasspath
    mainClass =
            'io.github.janguenter.bluemap.framedblocks.profile.framedblocks10_6.' +
                    'GeometryProfileProjector'
    outputs.file(projectedGeometryOutput)
    outputs.upToDateWhen { false }

    doFirst {
        if (!rawGeometryExport.isPresent()) {
            throw new GradleException(
                    'Set -PrawGeometryExport=<path-to-exact-schema-v2-client-export.gz>'
            )
        }
        args = [
                file(rawGeometryExport.get()).absolutePath,
                projectedGeometryOutput.get().absolutePath
        ]
    }
}

def expectedBlueMapCommit = '7e07f4e74ec1e92a6ead9aa1e66054af3e133aac'
def expectedBlueMapBranch = 'feature/backport-5.23-stateless-java-web-server'
def expectedBlueMapApiCommit = '285c9a60eff3ac2b0cab308ce1058d1565be0971'
def expectedGeometryGzipBytes = 1256231L
def expectedGeometryGzipSha256 =
        'd5a91b78090116b9223f1e96d6903cfd6261d7076b8cbe8d67d469ea2de44253'
def expectedGeometryJsonBytes = 56464720L
def expectedGeometryJsonSha256 =
        'e16b72167389c92b558dcb5a13d2cbae4e56a59da3f7cdb689c81637798cd001'
def blueMapSourceDir = providers.gradleProperty('bluemapSourcePath')
        .map { file(it) }
        .orElse(file('../bluemap-backport'))

tasks.register('verifyBlueMapSource') {
    inputs.dir(blueMapSourceDir)

    doLast {
        def resolveHead = { File repository ->
            providers.exec {
                commandLine 'git', '-C', repository.absolutePath, 'rev-parse', 'HEAD'
            }.standardOutput.asText.get().trim()
        }
        def blueMapHead = resolveHead(blueMapSourceDir.get())
        if (blueMapHead != expectedBlueMapCommit) {
            throw new GradleException(
                    "BlueMap source is ${blueMapHead}; expected ${expectedBlueMapCommit}"
            )
        }

        def resolveGit = { File repository, String... arguments ->
            providers.exec {
                commandLine(['git', '-C', repository.absolutePath] + arguments.toList())
            }.standardOutput.asText.get().trim()
        }
        def blueMapBranch = resolveGit(blueMapSourceDir.get(), 'branch', '--show-current')
        if (blueMapBranch != expectedBlueMapBranch) {
            throw new GradleException(
                    "BlueMap source is on branch ${blueMapBranch}; " +
                            "expected ${expectedBlueMapBranch} at ${expectedBlueMapCommit}"
            )
        }

        def apiHead = resolveHead(new File(blueMapSourceDir.get(), 'api'))
        if (apiHead != expectedBlueMapApiCommit) {
            throw new GradleException(
                    "BlueMapAPI source is ${apiHead}; expected ${expectedBlueMapApiCommit}"
            )
        }
    }
}

tasks.named('compileJava').configure {
    dependsOn tasks.named('verifyBlueMapSource')
}


pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'bluemap-framedblocks-addon'

def expectedBlueMapTag = 'v5.22-agent.backport-5.22-mc1.21.1-2'
def expectedBlueMapCommit = '9be321df995a1103808621d529eb72773e719d4d'
def expectedBlueMapApiCommit = '285c9a60eff3ac2b0cab308ce1058d1565be0971'
def blueMapSourcePath = providers.gradleProperty('bluemapSourcePath')
        .getOrElse('../bluemap-backport')
def blueMapSource = file(blueMapSourcePath)

if (!blueMapSource.isDirectory()) {
    throw new GradleException(
            "BlueMap source checkout not found at ${blueMapSource}. " +
                    'Set -PbluemapSourcePath=<path> to the exact workspace backport.'
    )
}

def gitOutput = { File repository, String... arguments ->
    providers.exec {
        commandLine(['git', '-C', repository.absolutePath] + arguments.toList())
    }.standardOutput.asText.get().trim()
}

def blueMapHead = gitOutput(blueMapSource, 'rev-parse', 'HEAD')
if (blueMapHead != expectedBlueMapCommit) {
    throw new GradleException(
            "Refusing to evaluate BlueMap ${blueMapHead}; expected ${expectedBlueMapCommit}"
    )
}

def blueMapTag = gitOutput(blueMapSource, 'describe', '--exact-match', '--tags', 'HEAD')
if (blueMapTag != expectedBlueMapTag) {
    throw new GradleException(
            "Refusing to evaluate BlueMap tag ${blueMapTag}; expected ${expectedBlueMapTag}"
    )
}

def blueMapBranch = gitOutput(blueMapSource, 'branch', '--show-current')
if (!blueMapBranch.isEmpty()) {
    throw new GradleException(
            "Refusing to evaluate BlueMap on branch ${blueMapBranch}; " +
                    "check out ${expectedBlueMapTag} detached so BlueMap.VERSION is canonical"
    )
}

def blueMapApiSource = new File(blueMapSource, 'api')
def blueMapApiHead = gitOutput(blueMapApiSource, 'rev-parse', 'HEAD')
if (blueMapApiHead != expectedBlueMapApiCommit) {
    throw new GradleException(
            "Refusing to evaluate BlueMapAPI ${blueMapApiHead}; " +
                    "expected ${expectedBlueMapApiCommit}"
    )
}

if (!gitOutput(blueMapSource, 'status', '--porcelain').isEmpty()) {
    throw new GradleException('Refusing to evaluate a dirty BlueMap source checkout')
}
if (!gitOutput(blueMapApiSource, 'status', '--porcelain').isEmpty()) {
    throw new GradleException('Refusing to evaluate a dirty BlueMapAPI source checkout')
}

includeBuild(blueMapSource) {
    dependencySubstitution {
        substitute module('de.bluecolored:bluemap-core') using project(':core')
    }
}
